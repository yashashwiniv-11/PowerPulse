<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Power Pulse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Power Pulse</h1>

<div class="container">
  <input type="text" id="areaInput" placeholder="Enter Area Name">

  <div class="buttons">
    <button onclick="sendStatus('Power Cut')" class="cut">Power Cut</button>
    <button onclick="sendStatus('Power Restored')" class="restore">Power Restored</button>
    <button onclick="clearAll()" class="clear">Clear All</button>
  </div>

  <h2>Current Status</h2>

  <table>
    <thead>
      <tr>
        <th>Area</th>
        <th>Status</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="statusTable">
      <tr><td colspan="3">No reports yet</td></tr>
    </tbody>
  </table>
</div>

<script src="script.js"></script>
</body>
</html>
