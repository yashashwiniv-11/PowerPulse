<!DOCTYPE html>
<html>
<head>
  <title>PowerPulse</title>

  <link
    rel="stylesheet"
    href="style.css"
  />
</head>

<body>

<div class="container">

  <h1>⚡ PowerPulse</h1>

  <div class="top-bar">

    <input
      type="text"
      id="areaInput"
      placeholder="Enter Area Name"
    />

    <button
      class="cut"
      onclick="updatePower('Power Cut')"
    >
      Power Cut
    </button>

    <button
      class="restore"
      onclick="updatePower('Power Restored')"
    >
      Power Restored
    </button>

    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

  <br>

  <input
    type="text"
    id="searchInput"
    placeholder="Search Area..."
  />

  <table>

    <thead>
      <tr>
        <th>Area</th>
        <th>Status</th>
        <th>Time</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="tableBody">

    </tbody>

  </table>

</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script src="script.js"></script>

</body>
</html>
