<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>

  <link
    rel="stylesheet"
    href="style.css"
  />
</head>

<body>

<div class="login-box">

  <h2>PowerPulse Admin</h2>

  <input
    type="text"
    id="username"
    placeholder="Username"
  />

  <input
    type="password"
    id="password"
    placeholder="Password"
  />

  <button onclick="login()">
    Login
  </button>

  <p id="msg"></p>

</div>

<script src="login.js"></script>

</body>
</html>
